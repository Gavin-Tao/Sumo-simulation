nl: During the first 30 minutes buses get level 4, afterwards level 3. Ambulances
  5, others 1.
ir:
  version: 1
  assignments:
  - match:
      type: ambulance
    level: 5
  - match:
      type: bus
      time_window:
      - 0
      - 1800
    level: 4
  - match:
      type: bus
    level: 3
  - match:
      type: '*'
    level: 1
