# 统一配置族 v2 (2026-08-31, 用户定案, 覆盖 v1/3600s 版):
# 底座 = exp217(std臂)/exp220(gs臂) 逐位 (1000s 集长, 2000 集, MSE, 无 grad_clip,
#   target_update 20, capacity 50k — 1x1/1x3 已证本土配方)。
# 仅四项取 208/211 稳定包值: gamma 0.95, use_double, target_clip_max 0.0 (Q<=0 钳位),
#   eps 0.05/30k。
# 语义层三场景统一 (沿用 2026-08-31 两层拆分决定): 表驱动 reward priority-avg-waiting
#   + 显式 priority_source (桶=权重对齐) + obs 加 psi 下游 cq + lane_occ + awt cap500/local
#   (槽维恒 27, 与 Dublin 208/211 同 schema)。
# 方法包: gs = perphase + enum_frap + FRAPQNet(16/16); std = legacy + 原生相位 + DQN(128)。
# Dublin 两格 = exp208/211 原样。历史臂 217/220/136 为参照行。

name: "exp245_1x1_unified_gs_541"

wandb_project: "sumo-rl-1x1"

net_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb/syc_4phases_enum.net.xml"
route_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb.rou.xml"
cfg_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb_enum.sumocfg"

# Environment (base: exp217/220 逐位)
observation_class: "PriorityMovement"
obs_phase_state:   "perphase"
obs_fields:        ["count", "queue", "mean_awt"]
# 语义层 (统一, 取 208/211): ψ下游cq + lane_occ + awt 规整 → 槽维 27
obs_awt_basis:     local
obs_awt_cap:       500
obs_lane_occ:      true
obs_downstream:    true
obs_downstream_fields: ["count", "queue"]
# 语义层 (统一): 表驱动 reward, 桶=权重对齐
priority_source:   {ambulance: 5, bus: 4, car: 1}
reward_fn:         "priority-avg-waiting"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# Action: enumerated protected phases + movement-duel FRAP (exp220 同款)
action_scheme:  "enum_frap"
enum_meta_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_20-80-99-1-Bus-Car-Amb_WEstr_only_NSamb/syc_4phases_enum_meta.json"
frap:
  embed_dim: 16
  pair_dim:  16

# DQN hyperparameters (exp217/220 逐位, 除注明的四项)
hidden_dim:    128
lr:            0.001
gamma:         0.95          # ← 208/211 值 (217/220: 0.99)
epsilon:       0.1
eps_start:     0.9
eps_end:       0.05          # ← 208/211 值 (217/220: 0.01)
eps_decay:     30000         # ← 208/211 值 (217/220: 5000)
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256
use_double:      true        # ← 208/211 值 (217/220: false)
target_clip_max: 0.0         # ← 208/211 值 (Q≤0 钳位; 217/220: 无)
use_per:         false

# Training / eval (exp217/220 逐位)
seed:                0
episodes:            2000
checkpoint_interval: 50
runs:                1
eval_interval: 5
eval_seed:     123
logging_mode: "basic"
