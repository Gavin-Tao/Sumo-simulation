# exp212: MaskablePPO on the exp205 Dublin setup (same env/obs/reward/meta,
# gamma 0.99 as exp205; only the algorithm changes DQN -> PPO).
# Trainer: experiments/train_ppo_dublin.py (NEW — train.py/train_ppo_uni.py untouched).
# PPO rollout: n_steps=720 (= one episode) x 18 junctions = 12960 samples/update.
name: exp212_dublin11h_531_ppo
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_8std.net.xml
route_file: ../nets/dublin/weekday_11h/car_weekday_11h.rou.xml,../nets/dublin/weekday_11h/bus_weekday_11h.rou.xml,../nets/dublin/weekday_11h/amb_weekday_11h.rou.xml
cfg_file: ../nets/dublin/weekday_11h/dublin_weekday_11h.sumocfg
observation_class: PriorityMovement
obs_phase_state: legacy
obs_fields:
- count
- queue
- mean_awt
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
obs_downstream: true
obs_downstream_fields:
- count
- queue
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
action_meta_file: ../nets/dublin/dublin_8std_meta.json
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
# ---- PPO hyperparameters (adapted from the exp49-68 PPO family) ----
lr: 0.0003
n_steps: 720          # one full episode per rollout
batch_size: 720       # 12960/720 = 18 minibatches per epoch
n_epochs: 10
gamma: 0.99           # exp205 convention
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
clip_reward: 10.0
# ---- Training ----
seed: 0
episodes: 800
checkpoint_interval: 50
metrics_interval: 50
runs: 1
logging_mode: basic
