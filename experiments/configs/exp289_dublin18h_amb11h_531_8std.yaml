# exp289_dublin18h_amb11h_531_8std (2026-09-22 用户令): exp285_dublin18h_531_8std 逐位, 仅换救护车路由为 11h 探针路线 (amb_weekday_18h_probe11h.rou.xml, = 11h 的 4 辆救护车) 与对应 sumocfg; 小汽车/公交路由、网络、全部超参不变。
# exp285_dublin18h_531_8std (2026-09-21 用户令): exp208_dublin11h_531_B_movement_legacy_cqm_outcq_mask_nocoord_stab_obsfix_clamp_eps05_g095 逐位, 仅换时段场景文件 (weekday_11h -> weekday_18h: 三个路由 + sumocfg); 其余逐键相同。
name: exp289_dublin18h_amb11h_531_8std
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_8std.net.xml
route_file: ../nets/dublin/weekday_18h/car_weekday_18h.rou.xml,../nets/dublin/weekday_18h/bus_weekday_18h.rou.xml,../nets/dublin/weekday_18h/amb_weekday_18h_probe11h.rou.xml
cfg_file: ../nets/dublin/weekday_18h/dublin_weekday_18h_probe11h.sumocfg
observation_class: PriorityMovement
obs_phase_state: legacy
obs_fields:
- count
- queue
- mean_awt
# ---- obs-side fixes (audit 2026-06-12, all measured defects) ----
obs_awt_basis: local      # strip inherited wait -> stationary feature distribution
obs_awt_cap: 500          # bound worst-case stuck-on-lane wait at feature 5.0
obs_lane_occ: true        # shared-lane physical occupancy truth (+12 dims)
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
# ---- training-side stabilization (deadly-triad, exp200-validated recipe) ----
eps_decay: 30000          # exploration tail ~ep80 instead of ep30
target_update: 720        # sync once per episode (720 steps) -> quasi-fixed TD target
capacity: 300000          # ~23 episodes in buffer instead of 3.8
use_double: true          # kill max-operator overestimation feedback
loss_fn: huber            # saturate gradients on exploding TD errors
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_meta_file: ../nets/dublin/dublin_8std_meta.json
obs_downstream: true
obs_downstream_fields:
- count
- queue
# ---- R1 (forensics Part 7): TD target clamp at the domain bound Q<=0 ----
target_clip_max: 0.0
