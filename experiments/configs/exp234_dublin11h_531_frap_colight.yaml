# exp234: B+FRAP+CoLight — exp232 逐位配方, 唯一变量 mtt_layers: 2→0。
# n_layers=0 时 MTT refine 为恒等 (attention 层数 0, 已单测+前向验证) →
# 精确退化为 "纯 FRAP 手工单跳对决 + 邻居 GAT", 即冠军配方 (exp211) + 协同。
# 消融定位: 232 答 "协同能否救 MTT"; 本臂答 "协同能否增强冠军" (梯子缺洞)。
# 对照: exp211 (无协同 FRAP) / exp232 (MTT+协同) / exp233 (MTT 无协同)。
# 1x3 时代 colight+B 有失稳前科 → 稳定包/双维分报同 232 不动。
name: exp234_dublin11h_531_frap_colight
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_enum.net.xml
route_file: ../nets/dublin/weekday_11h/car_weekday_11h.rou.xml,../nets/dublin/weekday_11h/bus_weekday_11h.rou.xml,../nets/dublin/weekday_11h/amb_weekday_11h.rou.xml
cfg_file: ../nets/dublin/weekday_11h/dublin_weekday_11h_enum.sumocfg
observation_class: PriorityMovement
obs_phase_state: perphase
obs_fields:
- count
- queue
- mean_awt
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
eps_decay: 30000
target_update: 720
capacity: 100000   # 同 exp232 [09] 方案A: CoLight replay 内存约束 (300k 触 OOM)
use_double: true
loss_fn: huber
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_scheme: enum_frap
enum_meta_file: ../nets/dublin/dublin_enum_meta.json
neighbor_map: ../nets/dublin/calibration/neighbor_map.yaml
frap:
  embed_dim: 16
  pair_dim: 16
  arch: mtt_colight
  mtt_heads: 4
  mtt_layers: 0    # ← 唯一变量 vs exp232: attention 恒等 → 纯 FRAP 对决 + 邻居 GAT
  n_neighbors: 4
obs_downstream: true
obs_downstream_fields:
- count
- queue
target_clip_max: 0.0
