# Experiment: exp116 — PriorityBCA obs + 5-2-1-avg-waiting-time reward, 1x3
# 1x3 counterpart of exp113 (1x1). 1% ambulance on WE through-corridor (WEamb scenario).
# Weights: car=1, bus=2, ambulance=5. Both obs and reward over all lanes (matched, no ctrl).
# Tuned DQN params from exp90/exp110
name: "exp116_1x3_521_avg_waiting_WEamb_tuned"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files (NS straight = bus, WE straight = 99% car + 1% ambulance)
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/Eq_350_NSbus_WE99-1-Car-Amb.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/Eq_350_NSbus_WE99-1-Car-Amb.sumocfg"

# Environment
observation_class: "PriorityBCA"
reward_fn:         "5-2-1-avg-waiting-time"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters (tuned, from exp90/110)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Training
seed:                0
episodes:            8000
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     42

# Logging
logging_mode: "basic"
