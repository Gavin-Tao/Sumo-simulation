# Experiment: exp21 — PressLightNorm obs, pressure-norm reward, 1x3 grid
# Difference from exp18 20: vehicle counts normalized to [0,1] by lane capacity
name: "exp21_presslightnorm_1x3_delta_5"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/Eq_350_100-0-100-0-Bus-Car.sumocfg"

# Environment
observation_class: "PressLightNorm"
reward_fn:         "pressure-norm"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false

# DQN hyperparameters
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Training
seed:                0
episodes:            5000
checkpoint_interval: 5
runs:                1
