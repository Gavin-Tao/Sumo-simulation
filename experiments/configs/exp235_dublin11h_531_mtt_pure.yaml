# exp235: 替代版 MTT (frap.arch=mtt_pure) — exp233 逐位配方, 唯一变量 arch。
# 意图审计 §1 的用户原规格: 注意力【替代】手工单跳对决 (对决/压制整块移除,
# Q = Σ_{m∈相位} g(d★_m), 竞争隐式化进 relation-biased attention)。
# 对照阶梯: exp211 (无注意力+手工对决) / exp233 (注意力+对决叠加) / 本臂
# (注意力替代对决)。KAN 注: 本臂只有 g 通道可读 (s 参数未训)。
name: exp235_dublin11h_531_mtt_pure
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_enum.net.xml
route_file: ../nets/dublin/weekday_11h/car_weekday_11h.rou.xml,../nets/dublin/weekday_11h/bus_weekday_11h.rou.xml,../nets/dublin/weekday_11h/amb_weekday_11h.rou.xml
cfg_file: ../nets/dublin/weekday_11h/dublin_weekday_11h_enum.sumocfg
observation_class: PriorityMovement
obs_phase_state: perphase
obs_fields:
- count
- queue
- mean_awt
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
eps_decay: 30000
target_update: 720
capacity: 300000
use_double: true
loss_fn: huber
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_scheme: enum_frap
enum_meta_file: ../nets/dublin/dublin_enum_meta.json
frap:
  embed_dim: 16
  pair_dim: 16
  arch: mtt_pure
  mtt_heads: 4
  mtt_layers: 2
obs_downstream: true
obs_downstream_fields:
- count
- queue
target_clip_max: 0.0
