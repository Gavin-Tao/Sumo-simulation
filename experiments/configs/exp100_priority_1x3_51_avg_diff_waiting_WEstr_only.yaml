# Experiment: exp100 — Priority obs, 51-avg-diff-waiting-time reward, 1x3, WEstr_only
# Reward: prev - curr of (5*bus_avg_wait + 1*car_avg_wait), per-vehicle average accumulated waiting time
name: "exp100_priority_1x3_51_avg_diff_waiting_WEstr_only"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.sumocfg"

# Environment
observation_class: "Priority"
reward_fn:         "51-avg-diff-waiting-time"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Training
seed:                0
episodes:            8000
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     42

# Logging
logging_mode: "full"
