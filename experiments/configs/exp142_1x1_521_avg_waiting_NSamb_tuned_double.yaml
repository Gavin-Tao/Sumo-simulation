# Experiment: exp142 — exp113 + Double DQN
# 与 exp113 完全一致,只增加 use_double=true
# 用途: 单独评估 Double DQN(修复 max-Q 高估偏差)对 1x1 521 救护车场景的影响
name: "exp142_1x1_521_avg_waiting_NSamb_tuned_double"

# wandb
wandb_project: "sumo-rl-1x1"

# SUMO files (NS straight has 1% ambulance, Poisson arrivals)
net_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/syc_4phases.net.xml"
route_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb.rou.xml"
cfg_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb.sumocfg"

# Environment
observation_class: "PriorityBCA"
reward_fn:         "5-2-1-avg-waiting-time"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters (与 exp113 完全一致)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Training
seed:                0
episodes:            5000
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     42

# Logging
logging_mode: "full"

# ─── DQN extensions (vs exp113) ────────────────────────────────────────────
use_double: true        # ← Double DQN: online net 选动作, target net 给值
use_per:    false       # PER 关闭(留给 exp143/144)
