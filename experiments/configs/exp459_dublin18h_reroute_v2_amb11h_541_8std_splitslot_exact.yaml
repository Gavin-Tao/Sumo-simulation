# exp459_dublin18h_reroute_v2_amb11h_541_8std_splitslot_exact (2026-10-26, 状态/奖励修正实施计划任务 10 的配置模板, 未启动):
#   exp457 逐位, 只改下面标 "2026-10-26" 的键:
#   (1) 网/meta/sumocfg 换成 dublin_8std_splitslot (cluster_21620852 的 link 2→E 右转、link 6→S 直行, 该路口可用动作 4→6; 其余 17 路口逐位相同);
#   (2) obs_all_connections / all_connections: 建表遍历每个信号索引下的全部连接 (389332 E/W 直行容量与出口/供车车道、133307283 N 直行出口车道);
#   (3) obs_slot_memo: false —— 每步按当前路线重查车辆运动, 不再按车辆 ID 整集缓存 (重访公交、路线终点);
#   (4) obs_awt_basis: visit + reward_wait_basis: visit —— 等待秒数读逐秒访问统计器 (本次在本路口进口边上、SUMO 判定为等待的秒数),
#       状态的 mean_awt 与奖励共用同一个数; 奖励不再做跨车道减法, 上游非 RL 路口的等待不再记给第一条 RL 车道。
#   注意: 奖励口径变了, 与 449/456/457/458 不可直接比较; 旧检查点只能做诊断评估。
# exp457_dublin18h_reroute_v2_amb11h_541_8std_slot12_f1 (2026-10-14, 用户令 "这是 531, 我还需要 521 541 111 的"): exp449 逐位, 优先级权重 5/4/1: 只把 priority_source.bus 由 3 改为 4 (与 exp304 对 298 的改法相同)。
name: exp459_dublin18h_reroute_v2_amb11h_541_8std_splitslot_exact
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_8std_splitslot.net.xml                                      # 2026-10-26 (1)
route_file: ../nets/dublin/weekday_18h_reroute_v2/car_weekday_18h.rou.xml,../nets/dublin/weekday_18h_reroute_v2/bus_weekday_18h.rou.xml,../nets/dublin/weekday_18h_reroute_v2/amb_weekday_18h_probe11h.rou.xml
cfg_file: ../nets/dublin/weekday_18h_reroute_v2/dublin_weekday_18h_probe11h_8std_splitslot.sumocfg   # 2026-10-26 (1)
observation_class: PriorityMovement
obs_phase_state: perphase   # 2026-10-10: 与 exp301 对等 (原 legacy)
obs_fields:
- count
- queue
- mean_awt
# ---- obs-side fixes (audit 2026-06-12, all measured defects) ----
obs_awt_basis: visit      # 2026-10-26 (4): 原 local
obs_awt_cap: 500          # bound worst-case stuck-on-lane wait at feature 5.0 (awt_log 开着时不生效, 保留)
obs_lane_occ: true        # shared-lane physical occupancy truth (+12 dims)
obs_all_connections: true # 2026-10-26 (2)
all_connections: true     # 2026-10-26 (2): TrafficSignal.out_lanes 同样收齐 (当前观测/奖励不用, 保持一致)
obs_slot_memo: false      # 2026-10-26 (3)
priority_source:
  ambulance: 5
  bus: 4
  car: 1
reward_fn: priority-avg-waiting
reward_wait_basis: visit  # 2026-10-26 (4)
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
# ---- training-side stabilization (deadly-triad, exp200-validated recipe) ----
eps_decay: 30000          # exploration tail ~ep80 instead of ep30
target_update: 720        # sync once per episode (720 steps) -> quasi-fixed TD target
capacity: 300000          # ~23 episodes in buffer instead of 3.8
use_double: true          # kill max-operator overestimation feedback
loss_fn: huber            # saturate gradients on exploding TD errors
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_meta_file: ../nets/dublin/dublin_8std_splitslot_meta.json                           # 2026-10-26 (1)
obs_downstream: true
obs_downstream_fields:
- count
- queue
# ---- R1 (forensics Part 7): TD target clamp at the domain bound Q<=0 ----
target_clip_max: 0.0
obs_awt_log: true            # 2026-10-10: 与 exp301 对等 (等待特征对数刻度, 替代 awt_cap 截断)
target_clip_min: -50.0       # 2026-10-10: 与 exp301 对等 (TD 目标下限; 8STD 的 Q 一般 -5..-20, 预计几乎不触发)

# ── 2026-10-14 exp449 改动 (其余与 exp334 逐位相同) ──
obs_header: false            # 去掉头部两维 (含相位已持续时间)
obs_slot_min_green: true     # 每个绿灯槽一位 min_green_ok
mask_min_green: true         # F1: 动态最短绿掩码 (选动作 + TD 目标)

# ── 2026-10-26 训练中评估改逐秒采样 (只影响 eval_system 指标, 评估奖励与 best.pth 选择依据不变) ──
eval_collector_1s: true
