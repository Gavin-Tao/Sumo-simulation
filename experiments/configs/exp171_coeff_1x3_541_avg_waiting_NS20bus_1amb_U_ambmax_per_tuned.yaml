# Experiment: exp171 — CoeffDQN + **5-4-1 ambmax + PER**, 1x3 NS20bus_1amb_U.
#
# 在 exp167 (5-4-1 ambmax NO PER) 基础上加 PER, 看 ambmax + PER 协同效果.
#
# 三方对照:
#   exp147 = 5-4-1 avg  NO PER   ← baseline
#   exp167 = 5-4-1 ambmax NO PER  ← ambmax only
#   exp153 = 5-4-1 avg  + PER     ← PER only (实测 amb 反而恶化, std 暴增)
#   exp171 = 5-4-1 ambmax + PER  ← ★ THIS, 两者结合
#
# 设计假设:
#   ambmax 让单 amb 的 TD-error 信号集中放大 (worst case 主导 reward)
#   PER 再多采这些 high-TD amb transition → 强化双重放大
#   理论上比 exp153 的 "avg+PER" 更稳定 (因为 ambmax 本身就让信号聚焦)
#
# HYPERPARAMS: 跟 exp153 完全一致 (mini_size=2000 是 PER 需要更大 warmup).
name: "exp171_coeff_1x3_541_avg_waiting_NS20bus_1amb_U_ambmax_per_tuned"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.sumocfg"

neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

observation_class: "PriorityBCA"
reward_fn:         "5-4-1-avg-waiting-time-ambmax"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters — 跟 exp153 一致 (PER 配套, mini_size 升到 2000)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     2000     # PER 需要更大 warmup
batch_size:    256

# PER 设置 (跟 exp153 完全一致)
use_per:           true
per_alpha:         0.6
per_beta_start:    0.4
per_beta_end:      1.0
per_beta_steps:    400000
per_eps:           1.0e-6

# Training
seed:                0
episodes:            2000
checkpoint_interval: 50
runs:                1

eval_interval: 5
eval_seed:     123

logging_mode:     "basic"
metrics_interval: 50

# use_double 默认 False
