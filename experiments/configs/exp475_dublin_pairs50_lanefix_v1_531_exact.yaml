name: exp475_dublin_pairs50_lanefix_v1_531_exact
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_8std_splitslot18_southclosed_corridor_nocg_lanefix.net.xml
route_file: ../nets/dublin/weekday_pairs50_lanefix_v1/background_cars_100.rou.xml,../nets/dublin/weekday_pairs50_lanefix_v1/background_gtfs_as_car.rou.xml,../nets/dublin/weekday_pairs50_lanefix_v1/pairs_tt1.rou.xml
cfg_file: ../nets/dublin/weekday_pairs50_lanefix_v1/scenario.sumocfg
observation_class: PriorityMovement
obs_phase_state: perphase   # 2026-10-10: 与 exp301 对等 (原 legacy)
obs_fields:
- count
- queue
- mean_awt
# ---- obs-side fixes (audit 2026-06-12, all measured defects) ----
obs_awt_basis: visit      # 2026-10-26 (4): 原 local
obs_awt_cap: 500          # bound worst-case stuck-on-lane wait at feature 5.0 (awt_log 开着时不生效, 保留)
obs_lane_occ: true        # shared-lane physical occupancy truth (+12 dims)
obs_all_connections: true # 2026-10-26 (2)
all_connections: true     # 2026-10-26 (2): TrafficSignal.out_lanes 同样收齐 (当前观测/奖励不用, 保持一致)
obs_slot_memo: false      # 2026-10-26 (3)
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
reward_wait_basis: visit  # 2026-10-26 (4)
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.9              # 2026-10-26 (用户批准): 与 eps_start 相等, 开始更新前的探索率不再是 0.1, 衰减曲线从 0.9 连续起步
eps_start: 0.9
eps_end: 0.05
# ---- training-side stabilization (deadly-triad, exp200-validated recipe) ----
eps_decay: 30000          # exploration tail ~ep80 instead of ep30
target_update: 720        # sync once per episode (720 steps) -> quasi-fixed TD target
capacity: 300000          # ~23 episodes in buffer instead of 3.8
use_double: true          # kill max-operator overestimation feedback
loss_fn: huber            # saturate gradients on exploding TD errors
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_meta_file: ../nets/dublin/dublin_8std_splitslot18_southclosed_corridor_nocg_lanefix_meta.json
obs_downstream: true
obs_downstream_fields:
- count
- queue
# ---- R1 (forensics Part 7): TD target clamp at the domain bound Q<=0 ----
target_clip_max: 0.0
obs_awt_log: true            # 2026-10-10: 与 exp301 对等 (等待特征对数刻度, 替代 awt_cap 截断)
target_clip_min: -50.0       # 2026-10-10: 与 exp301 对等 (TD 目标下限; 8STD 的 Q 一般 -5..-20, 预计几乎不触发)

# ── 2026-10-14 exp449 改动 (其余与 exp334 逐位相同) ──
obs_header: false            # 去掉头部两维 (含相位已持续时间)
obs_slot_min_green: true     # 每个绿灯槽一位 min_green_ok
mask_min_green: true         # F1: 动态最短绿掩码 (选动作 + TD 目标)

# ── 2026-10-26 训练中评估改逐秒采样 (只影响 eval_system 指标, 评估奖励与 best.pth 选择依据不变) ──
eval_collector_1s: true

# ── 2026-10-26 复查补修 ──
sync_target_init: true       # DQN 初始化即同步目标网络 (旧默认两套各自随机初始化)
train_strict_errors: true    # 训练循环只把 SUMO/TraCI 异常当作 "重置后继续", 其它异常直接抛出
