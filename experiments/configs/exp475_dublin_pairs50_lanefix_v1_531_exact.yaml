# exp475 (2026-10-29, 用户令 "修改之前跟修改之后的新场景 531 351 111 都跑一下, 跑完了以后再跑 18"): = exp470 逐位, 只改 name 与场景文件夹 (weekday_pairs50_lanefix → weekday_pairs50_lanefix_v1 = 修改时刻表之前的旧版, GitHub 42e8acd)。
