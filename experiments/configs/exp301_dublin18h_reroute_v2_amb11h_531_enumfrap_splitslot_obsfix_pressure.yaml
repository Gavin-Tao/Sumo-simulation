# exp301_dublin18h_reroute_v2_amb11h_531_enumfrap_splitslot_obsfix_pressure (2026-09-30 用户令 "在 300 基础上调参, 避免失控"): exp300 逐位, 只加三个 GS 侧开关 (与 exp293 相同): obs_since_green (每方向距上次绿灯秒数, 上限 600, 让饿死可观测), obs_awt_log (等待时间对数刻度, 锁死时特征幅值不再跳变 10 倍), frap.score=pressure (方向分 = 优先级加权排队压力 × (1+tanh(学习项)), 被饿死进口的相位自动得高分, Q 尺度跟随物理量)。针对 EXP300_DRIFT_2026-09-30 §2: ep79 Harcourt 路口饿死 SSG 进口 → 极端奖励入池 → 共享小网 Q 5→223 → 评估连崩。场景 (weekday_18h_reroute_v2)、路网 (splitslot)、其余超参与 exp300/298 逐键相同。 另加 target_clip_min: -50.0 (TD 目标下限, 新开关, 默认 None, 两个 agent 对称)。
