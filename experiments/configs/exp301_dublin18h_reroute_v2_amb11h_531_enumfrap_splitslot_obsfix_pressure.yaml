# exp211: enum_frap — enumerated protected phases + movement-duel FRAP agent.
# Arm 3 of the M4 comparison (spec FRAP_ENUM_DESIGN_2026-07-02 §5).
# All env/reward/training hyperparams copied from exp208 verbatim; the ONLY
# deltas: net/cfg -> enum, action_meta_file -> action_scheme/enum_meta_file,
# obs_phase_state legacy -> perphase (junction-independent obs dim), frap block.
name: exp301_dublin18h_reroute_v2_amb11h_531_enumfrap_splitslot_obsfix_pressure
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_enum_splitslot.net.xml
route_file: ../nets/dublin/weekday_18h_reroute_v2/car_weekday_18h.rou.xml,../nets/dublin/weekday_18h_reroute_v2/bus_weekday_18h.rou.xml,../nets/dublin/weekday_18h_reroute_v2/amb_weekday_18h_probe11h.rou.xml
cfg_file: ../nets/dublin/weekday_18h_reroute_v2/dublin_weekday_18h_probe11h_enum_splitslot.sumocfg
observation_class: PriorityMovement
obs_phase_state: perphase
obs_fields:
- count
- queue
- mean_awt
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
eps_decay: 30000
target_update: 720
capacity: 300000
use_double: true
loss_fn: huber
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_scheme: enum_frap
enum_meta_file: ../nets/dublin/dublin_enum_splitslot_meta.json
frap:
  embed_dim: 16
  pair_dim: 16
obs_downstream: true
obs_downstream_fields:
- count
- queue
target_clip_max: 0.0
# ── 2026-09-30 观测开关 + FRAP 压力打分 (同 exp293) ──
obs_since_green: true
obs_awt_log: true
frap:
  embed_dim: 16
  pair_dim: 16
  score: pressure
# ── 2026-09-30 TD 目标下限 (与 target_clip_max: 0.0 对称; 正常状态 Q≈−0.5…−5, 锁死状态目标可到 −200 以下; 截到 −50 后灾难状态仍远差于正常状态, 但不再拖偏共享网络; 见 EXP300_DRIFT §2.2) ──
target_clip_min: -50.0
