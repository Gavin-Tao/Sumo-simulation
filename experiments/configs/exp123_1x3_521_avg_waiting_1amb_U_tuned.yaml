# Experiment: exp123 — PriorityBCA obs + 5-2-1-avg-waiting-time reward, 1x3
# DQN counterpart of exp122 (CoLightOrig) on the 1amb_U scenario.
# Also: OFAT counterpart of exp116 (WEamb) on the "ambulance route" sensitivity axis.
#   2x2 grid (DQN/CoLight x WEamb/1amb_U): exp116 | exp123 (this) | exp119 | exp122
# Independent per-intersection DQN — no inter-ts cooperation (no GAT, no neighbor_map).
# Scenario: ambulance on diagonal 2-left-turn route(s) through all 3 intersections.
# Weights: car=1, bus=2, ambulance=5. Both obs and reward over all lanes (matched, no ctrl).
# Tuned DQN params reused from exp90 / exp110 / exp116 for clean cross-config comparison.
name: "exp123_1x3_521_avg_waiting_1amb_U_tuned"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files (NS bus, WE pure car, Amb on diagonal 2-left-turn route(s))
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_100bus_0car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_100bus_0car_WEcar_1amb_U/Eq_350_NS_100bus_0car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_100bus_0car_WEcar_1amb_U/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Environment
observation_class: "PriorityBCA"
reward_fn:         "5-2-1-avg-waiting-time"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters (tuned, same as exp116 for clean OFAT comparison)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Training
seed:                0
episodes:            1500
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     123

# Logging
logging_mode: "basic"
