# Post-hoc evaluation of exp126 (CoLight + 5-2-1) on NS20bus_1amb_U scenario.
# Same SUMO files + obs/reward/hyperparams as training; only num_seconds is extended
# to give ~20 ambulances per episode (was ~1 at num_seconds=1000) so priority-weight
# comparisons (5-2-1 / 5-3-1 / 5-4-1) are not dominated by Poisson variance.
#
# Requires: route file ends extended to >= 21600s (already done in rou.xml).
# Usage:
#   python experiments/eval_unified.py \
#       --agent colight \
#       --config experiments/configs/evaluation/eval_exp126_NS20bus_1amb_U.yaml \
#       --ckpt   experiments/models/exp126_*/<TS>/best.pth \
#       --episodes 1
name: "eval_exp126_NS20bus_1amb_U"

wandb_project: "sumo-rl-1x3"

# SUMO files — must match training to load checkpoint
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.sumocfg"

# Neighbor map for CoLight
neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

# Environment — must match training (obs + reward) so checkpoint matches
observation_class: "PriorityBCA"
reward_fn:         "5-2-1-avg-waiting-time"
num_seconds:       21600   # 6h sim @ λ=0.000972 amb/s → E[#amb] ≈ 21 per episode
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# CoLight architecture — must match training
hidden_dim:    128
n_heads:       2

# Misc training hyperparams kept for compatibility (unused by eval but harmless)
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Evaluation
seed: 123      # use the training-time eval_seed for consistency
runs: 1
