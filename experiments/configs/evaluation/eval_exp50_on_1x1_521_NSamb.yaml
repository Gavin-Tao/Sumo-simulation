# Evaluation config: exp50-trained PressLight model evaluated on 1x1 521-BCA NSamb scenario
#
# Purpose: test how a baseline PressLight DQN (trained on the no-ambulance 1x1 intersection)
# transfers to the ambulance-injected scenario. The model architecture, observation
# class, and reward function MUST match the original exp50 training config so the
# checkpoint can be loaded; only the SUMO files are swapped to the new amb route.
#
# Usage:
#   python experiments/eval_unified.py \
#       --agent dqn \
#       --config experiments/configs/evaluation/eval_exp50_on_1x1_521_NSamb.yaml \
#       --ckpt models/exp50_presslight_1x1_WEstr_only/<TIMESTAMP>/best.pth
name: "eval_exp50_on_1x1_521_NSamb"

# wandb (eval logs as a separate run)
wandb_project: "sumo-rl-1x1"

# SUMO files — NEW amb scenario (NS straight: 99% car + 1% ambulance, WE: 100% bus)
net_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/syc_4phases.net.xml"
route_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb.rou.xml"
cfg_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb/Eq_350_100-0-99-1-Bus-Car-Amb_WEstr_only_NSamb.sumocfg"

# Environment — must match exp50 to load checkpoint correctly
observation_class: "PressLight"
reward_fn:         "pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters — must match exp50 architecture for checkpoint to load
hidden_dim:    64
lr:            0.001
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Evaluation
seed:                42
runs:                1
