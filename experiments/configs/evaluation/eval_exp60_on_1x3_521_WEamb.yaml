# Evaluation config: exp60-trained PressLight model evaluated on 1x3 521-BCA WEamb scenario
#
# Purpose: test how a baseline PressLight DQN (trained on the no-ambulance 1x3 corridor)
# transfers to the ambulance-injected scenario. The model architecture, observation
# class, and reward function MUST match the original exp60 training config so the
# checkpoint can be loaded; only the SUMO files are swapped to the new amb route.
#
# Usage:
#   python experiments/eval_unified.py \
#       --agent dqn \
#       --config experiments/configs/evaluation/eval_exp60_on_1x3_521_WEamb.yaml \
#       --ckpt models/exp60_presslight_1x3_WEstr_only_0.01/<TIMESTAMP>/best.pth
name: "eval_exp60_on_1x3_521_WEamb"

# wandb (eval logs as a separate run; group keeps it under exp60)
wandb_project: "sumo-rl-1x3"

# SUMO files — NEW amb scenario (NS=bus, WE=99% car + 1% ambulance)
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/Eq_350_NSbus_WE99-1-Car-Amb.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NSbus_WE99-1-Car-Amb/Eq_350_NSbus_WE99-1-Car-Amb.sumocfg"

# Environment — must match exp60 to load checkpoint correctly
observation_class: "PressLight"
reward_fn:         "pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters — must match exp60 architecture for checkpoint to load
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Evaluation
seed:                42
runs:                1
