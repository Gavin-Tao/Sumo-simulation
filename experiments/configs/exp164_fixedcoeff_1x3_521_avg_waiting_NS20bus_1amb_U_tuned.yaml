# Experiment: exp164 — FixedCoeffDQN (TPAMI-style α=0.5 + uniform mean) + 5-2-1, 1x3 NS20bus_1amb_U.
# Pair with exp145 (CoeffDQN static β), exp161 (GATCoeffDQN dynamic β).
#
# ARCHITECTURE:
#   State input: aug_state = concat(own_obs, 4×nb_obs)  ← 同 CoeffDQN/GATCoeffDQN
#   Q-net:       standard MLP on aug_state             ← 同 CoeffDQN/GATCoeffDQN
#   Reward公式:  eff_r = α · own_r + (1-α) · mean(active nb_r)
#                  α = 0.5 fixed (TPAMI 论文 grid search 最优值)
#                  邻居 reward = uniform mean (无 GAT, 无 β 学习)
#
# 这是 TPAMI-style 静态 reward 协同的 baseline. 跟 GATCoeffDQN 唯一差异 = uniform mean vs dynamic GAT softmax.
# Δ (exp161 GATCoeffDQN - exp164 FixedCoeffDQN) 直接 = "dynamic β 的贡献".
#
# Position in design space:
#                  State 层协同              Reward 层协同
#   static         concat (Q-net input)     ★ this agent (FixedCoeffDQN) / CoeffDQN β (失效)
#   dynamic        GAT (CoLight)            GATCoeffDQN (proposed)
#
# HYPERPARAMS: 跟 exp145 严格一致 (controlled comparison).
name: "exp164_fixedcoeff_1x3_521_avg_waiting_NS20bus_1amb_U_tuned"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

observation_class: "PriorityBCA"
reward_fn:         "5-2-1-avg-waiting-time"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters — IDENTICAL to exp145 (controlled)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# FixedCoeffDQN-specific
alpha:          0.5        # TPAMI 同款固定值, eff_r = 0.5·own + 0.5·mean(active nb_r)

# Training
seed:                0
episodes:            2000
checkpoint_interval: 50
runs:                1

eval_interval: 5
eval_seed:     123       # matched to exp145/126/161 for fair comparison

logging_mode:     "basic"
metrics_interval: 50

# use_double / use_per intentionally NOT set → default False
