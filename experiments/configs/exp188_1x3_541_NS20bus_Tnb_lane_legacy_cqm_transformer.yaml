# Scheme T + BOUNDARY-TOKEN coordination (obs-level) on 1x3 — vs exp185 (T no-coord).
# Single-variable delta vs exp185: observation_class PriorityLaneToken → PriorityLaneTokenNb.
# Remote tokens = this intersection's outgoing lanes that are the neighbour's incoming
# lanes (shared corridor links); each carries full φ priority-bucket detail, so e.g. an
# ambulance entering the next link is visible here as a live p5 token. The SAME encoder
# attends over own+remote tokens — coordination as a wider receptive field:
#   • no neighbor_map, no special trainer (plain train.py)
#   • token = [is_remote] + [service K] + φ(cqm); remote slots auto-uniform (=max over
#     TLS, here 6: e has 2 neighbours ×3 lanes; t/J0 pad their 2nd slot-triple with zeros)
#   • exp185 vs exp188 vs exp186(GAT-on-state, B) vs exp187(reward-β, B) spans the
#     coordination ladder; this is the T-native rung.
name: "exp188_1x3_541_NS20bus_Tnb_lane_legacy_cqm_transformer"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Environment — identical to exp185 except the obs class (boundary tokens)
observation_class: "PriorityLaneTokenNb"
obs_phase_state:   "legacy"
obs_fields:        ["count", "queue", "mean_awt"]
obs_phase_service: true   # R1 lane-identity multi-hot
priority_source:   {ambulance: 5, bus: 4, car: 1}   # bucket index == reward weight (aligned 06-11; exp172-183 ran bus=p3)
reward_fn:         "priority-avg-waiting"   # table-driven (== 5-4-1 bit-exact, verified); weights from priority_source
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# Q-network architecture (token_dim/n_tokens auto from token_layout)
agent_arch: "transformer"
grad_clip: 1.0
transformer:
  d_model:    128
  nhead:      4
  num_layers: 2
  dim_ff:     256

# DQN hyperparameters (same as exp185)
hidden_dim:    128
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Training
seed:                0
episodes:            2000
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     123

# Logging
logging_mode: "basic"

# Vanilla DQN — no Double, no PER
use_double: false
use_per:    false
