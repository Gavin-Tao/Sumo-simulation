# exp233: exp211 配方 + FRAP 头换 MTT (frap.arch=mtt, 无协同) — 路口内
# movement-token self-attention 替代手工单跳对决。唯一变量 vs exp211 = frap.arch。
# 作用: MTT-only 对照臂, 与 exp232(MTT+CoLight) 组成协同净效应的干净消融
# (exp211 单跳 → exp233 MTT路口内 → exp232 MTT+跨路口协同)。稳定包沿用 exp211。
name: exp233_dublin11h_531_mtt
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_enum.net.xml
route_file: ../nets/dublin/weekday_11h/car_weekday_11h.rou.xml,../nets/dublin/weekday_11h/bus_weekday_11h.rou.xml,../nets/dublin/weekday_11h/amb_weekday_11h.rou.xml
cfg_file: ../nets/dublin/weekday_11h/dublin_weekday_11h_enum.sumocfg
observation_class: PriorityMovement
obs_phase_state: perphase
obs_fields:
- count
- queue
- mean_awt
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.95
epsilon: 0.1
eps_start: 0.9
eps_end: 0.05
eps_decay: 30000
target_update: 720
capacity: 300000
use_double: true
loss_fn: huber
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_scheme: enum_frap
enum_meta_file: ../nets/dublin/dublin_enum_meta.json
frap:
  embed_dim: 16
  pair_dim: 16
  arch: mtt
  mtt_heads: 4
  mtt_layers: 2
obs_downstream: true
obs_downstream_fields:
- count
- queue
target_clip_max: 0.0
