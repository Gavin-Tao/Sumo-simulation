# Experiment: exp41 — Priority obs, 31-priority-pressure, 1x3, delta 5, EW=60%bus/40%car
name: "exp41_priority_1x3_31_delta_5_60-40"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_60-40-60-40-Bus-Car/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_60-40-60-40-Bus-Car/Eq_350_60-40-60-40-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_60-40-60-40-Bus-Car/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Environment
observation_class: "Priority"
reward_fn:         "31-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Training
seed:                0
episodes:            5000
checkpoint_interval: 5
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50
