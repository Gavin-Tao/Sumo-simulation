# exp279_1x3_gs_enum_g099_hold (2026-09-02 用户令): exp265 逐位 + 唯一变量 frap.hold_bias=true —— Q'(k)=Q(k)+b·1[k=当前相位], b 可学 (初始 0)。
name: "exp279_1x3_gs_enum_g099_hold"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases_enum.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U_enum.sumocfg"

# Environment
observation_class: "PriorityMovement"
obs_phase_state:   "perphase"
obs_fields:        ["count", "queue", "mean_awt"]
# 语义层 1x3 专属 (2026-09-01 用户令): 有真实下游路口, Dublin 式 ψ/occ/awt 有工程理由
obs_awt_basis:     local
obs_awt_cap:       500
obs_lane_occ:      true
obs_downstream:    true
obs_downstream_fields: ["count", "queue"]
priority_source:   {ambulance: 5, bus: 3, car: 1}   # v3 改动 2: 桶=权重对齐
reward_fn:         "priority-avg-waiting"           # 与 5-3-1 legacy 数值等价
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# Action: enumerated protected phases + movement-duel FRAP agent (spec FRAP_ENUM_DESIGN_2026-07-02)
action_scheme:  "enum_frap"
enum_meta_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases_enum_meta.json"
frap:
  embed_dim: 16
  pair_dim:  16
  hold_bias: true   # ← 唯一改动: 当前相位保持偏置 (可学标量 b, 初始 0)

# DQN hyperparameters: 16 键全同 exp208/211 (v3 改动 1)
hidden_dim:    128
lr:            0.001
gamma:         0.99          # ← 唯一改动 (242: 0.95)
epsilon:       0.1
eps_start:     0.9
eps_end:       0.05          # ← 208/211 值 (217/220: 0.01)
eps_decay:     30000         # ← 208/211 值 (217/220: 5000)
target_update: 720           # ← 208/211 值 (217/220: 20)
capacity:      300000        # ← 208/211 值 (217/220: 50k)
mini_size:     1000
batch_size:    256
loss_fn:       huber         # ← 208/211 值 (217/220: MSE)
grad_clip:     1.0           # ← 208/211 值 (217/220: 无)
use_double:      true        # ← 208/211 值 (217/220: false)
target_clip_max: 0.0         # ← 208/211 值 (Q≤0 钳位; 217/220: 无)
use_per:         false

# Training
seed:                0
episodes:            5000          # 用户定案 2026-09-01
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     123

# Logging
logging_mode: "basic"

