# Experiment: exp90 — Original CoLight DQN tuned (Wei et al., KDD 2019)
# Multi-head GAT: LeakyReLU attention + ELU output, n_heads=2
# Tuned from exp87: lower lr, larger network, slower epsilon decay, bigger replay buffer
# Architecture: Q-head input = hidden_dim * (n_heads + 1) = 128 * 3 = 384 dims
name: "exp90_colightorig_1x3_priority_51_WEstr_only_tuned"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Neighbor map: [up, down, left, right], null = no neighbor
# Layout (left → right): t — e — J0
neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

# Environment
observation_class: "Priority"
reward_fn:         "51-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    128     # 64→128: more capacity for multi-head GAT (Q-head sees 128*3=384 dims)
n_heads:       2       # original CoLight paper setting; 1x3 chain has max 2 neighbors
lr:            0.001   # same as CoLight; Adam normalises gradients, 1.6× more params is not a concern
gamma:         0.99
epsilon:       0.1
eps_start:     0.9     # 0.5→0.9: multi-head attention needs more exploration to learn patterns
eps_end:       0.01
eps_decay:     5000    # 1000→5000: converges ~ep250 instead of ep5
target_update: 20      # 10→20: more stable target for larger network
capacity:      50000   # 10000→50000: larger buffer for diverse experience
mini_size:     1000    # 500→1000: wait for more samples before training starts
batch_size:    256

# Training
seed:                0
episodes:            10000
checkpoint_interval: 50
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50

# Evaluation during training (set eval_interval: 0 to disable)
eval_interval: 5     # run one greedy eval episode every N episodes
eval_seed:     0     # same seed as training for consistent comparison
