# Experiment: exp54 — PPO, 51-priority-pressure, 1x1, WEstr_only
# Fix for policy collapse in exp49: increase ent_coef 0.05 -> 0.15
# Higher entropy forces policy to maintain diverse phase selection
name: "exp54_ppo_1x1_51_WEstr_only_entcoef"

# wandb
wandb_project: "sumo-rl-1x1"

# SUMO files
net_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/syc_4phases.net.xml"
route_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car_WEstr_only.rou.xml"
cfg_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car_WEstr_only.sumocfg"

# Environment
observation_class: "Priority"
reward_fn:         "51-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# PPO hyperparameters
lr:          0.0003
n_steps:     2000
batch_size:  200
n_epochs:    10
gamma:       0.99
gae_lambda:  0.95
clip_range:  0.2
ent_coef:    0.15    # 0.05 -> 0.15: prevent policy collapse at 5:1
vf_coef:     0.5

# Training
seed:                0
episodes:            5000
checkpoint_interval: 50
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50
