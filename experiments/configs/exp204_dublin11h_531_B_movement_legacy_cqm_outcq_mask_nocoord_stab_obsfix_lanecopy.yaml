name: exp204_dublin11h_531_B_movement_legacy_cqm_outcq_mask_nocoord_stab_obsfix_lanecopy
wandb_project: sumo-rl-dublin
net_file: ../nets/dublin/dublin_8std.net.xml
route_file: ../nets/dublin/weekday_11h/car_weekday_11h.rou.xml,../nets/dublin/weekday_11h/bus_weekday_11h.rou.xml,../nets/dublin/weekday_11h/amb_weekday_11h.rou.xml
cfg_file: ../nets/dublin/weekday_11h/dublin_weekday_11h.sumocfg
observation_class: PriorityMovement
obs_phase_state: legacy
obs_fields:
- count
- queue
- mean_awt
# ---- obs-side fixes: same as exp203 ----
obs_awt_basis: local
obs_awt_cap: 500
obs_lane_occ: true
# ---- the ONE difference vs exp203: B_copy ablation ----
# lane-detector aggregation, no route intent: shared-lane slots get identical
# copies, multi-lane slots get the capacity-weighted mean. Tests how much
# intent resolution buys (and is the detector-only deployable variant).
obs_slot_stats: lane_copy
priority_source:
  ambulance: 5
  bus: 3
  car: 1
reward_fn: priority-avg-waiting
num_seconds: 3600
delta_time: 5
yellow_time: 2
min_green: 5
use_gui: false
use_max_green: true
max_green: 50
hidden_dim: 128
lr: 0.001
gamma: 0.99
epsilon: 0.1
eps_start: 0.9
eps_end: 0.01
eps_decay: 30000
target_update: 720
capacity: 300000
use_double: true
loss_fn: huber
grad_clip: 1.0
mini_size: 1000
batch_size: 256
seed: 0
episodes: 800
checkpoint_interval: 50
runs: 1
eval_interval: 5
eval_seed: 123
logging_mode: basic
use_per: false
action_meta_file: ../nets/dublin/dublin_8std_meta.json
obs_downstream: true
obs_downstream_fields:
- count
- queue
