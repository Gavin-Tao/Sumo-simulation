# Experiment: exp91 — CoLightDQN + NoisyNetworks, Priority obs, 51-priority-pressure, 1x3, WEstr_only
# Based on exp88 (tuned); epsilon-greedy replaced by NoisyLinear parameter-space exploration
# eps_start/end/decay are ignored when use_noisy=true
name: "exp91_colight_1x3_priority_51_WEstr_only_noisy"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Neighbor map: [up, down, left, right], null = no neighbor
# Layout (left → right): t — e — J0
neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

# Environment
observation_class: "Priority"
reward_fn:         "51-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    128
lr:            0.001
gamma:         0.99
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256
use_noisy:     true    # NoisyLinear on own_encoder/nb_encoder/q_head; attn_score stays deterministic; epsilon-greedy disabled

# Training
seed:                0
episodes:            10000
checkpoint_interval: 50
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50

# Evaluation during training (set eval_interval: 0 to disable)
eval_interval: 5 
eval_seed:     0
