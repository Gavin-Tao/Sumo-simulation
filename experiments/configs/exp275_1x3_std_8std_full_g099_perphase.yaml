# exp275_1x3_std_8std_full_g099_perphase (2026-09-02 用户令, 论文主方法 std 格): exp264_1x3_std_8std_full_g099 逐位 + 唯一变量 观测 legacy->perphase。
# exp264 (2026-09-01 用户令): 1x3 模板线 = exp244 逐位 + 两处改动: (1) γ 0.95->0.99 (1x1 判决);
# (2) 相位集合 原生4 -> 完整8 (1x3_8std8: 每口 8std 管线 7 相位 + a3=WE左转对, foes+合流双检).
# 其余同 244: DQN(128) legacy 观测 + 下游语义层, 稳定值 (double/钳位/huber/clip/ε.05-30k/target720/池300k),
# 表驱动 531, 1000s x 5000 集, eval 5/123。对照: 264 vs 244 (γ+相位集合), 264 vs 265 (方法)。
name: "exp275_1x3_std_8std_full_g099_perphase"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_8std8.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
action_meta_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_8std8_meta.json"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.sumocfg"

# Environment
observation_class: "PriorityMovement"
obs_phase_state:   "perphase"   # ← 唯一改动 (基臂 legacy): 与 gs 臂观测排布对等
obs_fields:        ["count", "queue", "mean_awt"]
# 语义层 1x3 专属 (2026-09-01 用户令): 有真实下游路口, Dublin 式 ψ/occ/awt 有工程理由
obs_awt_basis:     local
obs_awt_cap:       500
obs_lane_occ:      true
obs_downstream:    true
obs_downstream_fields: ["count", "queue"]
priority_source:   {ambulance: 5, bus: 3, car: 1}   # v3 改动 2: 桶=权重对齐
reward_fn:         "priority-avg-waiting"           # 与 5-3-1 legacy 数值等价
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters: 16 键全同 exp208/211 (v3 改动 1)
hidden_dim:    128
lr:            0.001
gamma:         0.99          # ← 1x1 γ判决 (244: 0.95)
epsilon:       0.1
eps_start:     0.9
eps_end:       0.05          # ← 208/211 值 (217/220: 0.01)
eps_decay:     30000         # ← 208/211 值 (217/220: 5000)
target_update: 720           # ← 208/211 值 (217/220: 20)
capacity:      300000        # ← 208/211 值 (217/220: 50k)
mini_size:     1000
batch_size:    256
loss_fn:       huber         # ← 208/211 值 (217/220: MSE)
grad_clip:     1.0           # ← 208/211 值 (217/220: 无)
use_double:      true        # ← 208/211 值 (217/220: false)
target_clip_max: 0.0         # ← 208/211 值 (Q≤0 钳位; 217/220: 无)
use_per:         false

# Training
seed:                0
episodes:            5000          # 用户定案 2026-09-01
checkpoint_interval: 50
runs:                1

# Evaluation during training
eval_interval: 5
eval_seed:     123

# Logging
logging_mode: "basic"

