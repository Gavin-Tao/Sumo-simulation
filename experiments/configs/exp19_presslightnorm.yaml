# Experiment: exp19 — PressLightNorm obs, pressure-norm reward, 1x3 grid
# Difference from exp18: vehicle counts normalized to [0,1] by lane capacity
name: "exp19_presslightnorm_1x3"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car/train_only.sumocfg"   # no SUMO outputs during training (58.8% per-episode saving, dynamics bit-identical — PROJECT_AUDIT V8)

# Environment
observation_class: "PressLightNorm"
reward_fn:         "pressure-norm"
num_seconds:       1000
delta_time:        10     # >= yellow_time + min_green to avoid action filtering
yellow_time:       2
min_green:         5
use_gui:           false

# DQN hyperparameters
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000

# Training
seed:                0
episodes:            5000
checkpoint_interval: 5
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50
