# Scheme B (cqm) on 1x3 + CoLightOrig COORDINATION (multi-head GAT, state-layer).
# Coordination counterpart of exp184 (B-movement cqm, 1x3, no-coord): SAME obs
# (PriorityMovement, legacy, count+queue+mean) — the only change is the agent fuses
# neighbour observations via GAT attention (L1 of the coordination ladder).
# Run with trainorico.py (CoLightOrigDQN), NOT train.py.
#   exp184 (no-coord, L0) vs exp186 (CoLightOrig, L1) isolates the coordination
#   variable on identical B-cqm state — directly probes whether state-layer
#   coordination amplifies the 5-4-1 inversion (the COORDINATION_ANALYSIS finding)
#   now that ambulance has a dedicated priority-bucket signal.
# Multi-head GAT: n_heads=2 (1x3 chain has ≤2 neighbours); Q-head input = hidden*(n_heads+1).
name: "exp186_1x3_541_NS20bus_colightorig_B_movement_legacy_cqm"

wandb_project: "sumo-rl-1x3"

net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/Eq_350_NS_20bus_80car_WEcar_1amb_U.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_NS_20bus_80car_WEcar_1amb_U/train_only.sumocfg"   # no tripinfo/fcd/TLS outputs: training reads none of them; measured 58.8% per-episode saving

# Neighbor map: [up, down, left, right], null = no neighbor.  Chain: t - e - J0
neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

# Environment — same obs as exp184 (B cqm); coordination added at the agent layer
observation_class: "PriorityMovement"
obs_phase_state:   "legacy"
obs_fields:        ["count", "queue", "mean_awt"]
priority_source:   {ambulance: 5, bus: 4, car: 1}   # bucket index == reward weight (aligned 06-11; exp172-183 ran bus=p3)
reward_fn:         "priority-avg-waiting"   # table-driven (== 5-4-1 bit-exact, verified); weights from priority_source
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# CoLightOrig (multi-head GAT) hyperparameters
hidden_dim:    128     # Q-head sees hidden*(n_heads+1) = 384 dims
n_heads:       2       # original CoLight setting; 1x3 chain has ≤2 neighbours
lr:            0.001
gamma:         0.99
epsilon:       0.1
eps_start:     0.9
eps_end:       0.01
eps_decay:     5000
target_update: 20
capacity:      50000
mini_size:     1000
batch_size:    256

# Training
seed:                0
episodes:            2000
checkpoint_interval: 50
runs:                1

# Logging
logging_mode:     "basic"
metrics_interval: 50

# Evaluation during training
eval_interval: 5
eval_seed:     123
