# Experiment: exp88 — CoLightDQN tuned, Priority obs, 51-priority-pressure, 1x3, WEstr_only
# Tuned from exp86: lower lr, larger network, slower epsilon decay, bigger replay buffer
name: "exp88_colight_1x3_priority_51_WEstr_only_tuned"

# wandb
wandb_project: "sumo-rl-1x3"

# SUMO files
net_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/1x3_4phases.net.xml"
route_file: "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.rou.xml"
cfg_file:   "../nets/syc/1x3/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car.sumocfg"

# Neighbor map: [up, down, left, right], null = no neighbor
# Layout (left → right): t — e — J0
neighbor_map:
  "t":  [null, null, null, "e"]
  "e":  [null, null, "t",  "J0"]
  "J0": [null, null, "e",  null]

# Environment
observation_class: "Priority"
reward_fn:         "51-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    128     # 64→128: bus/car split obs needs more capacity
lr:            0.001   # 0.01→0.001: Adam standard, 0.01 caused Q-value instability
gamma:         0.99
epsilon:       0.1
eps_start:     0.9     # 0.5→0.9: GAT needs more early exploration to learn attention
eps_end:       0.01
eps_decay:     5000    # 1000→5000: now converges ~ep250 instead of ep5
target_update: 20      # 10→20: slower target sync for more stable Q estimates
capacity:      50000   # 10000→50000: larger buffer for diverse experience
mini_size:     1000    # 500→1000: wait for more samples before training starts
batch_size:    256

# Training
seed:                0
episodes:            10000
checkpoint_interval: 50
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50

# Evaluation during training (set eval_interval: 0 to disable)
eval_interval: 5     # run one greedy eval episode every N episodes
eval_seed:     0     # same seed as training for consistent comparison
