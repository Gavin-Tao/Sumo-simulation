# Experiment: exp97 — Priority obs, 51-priority-pressure, 1x1, WEstr_only
# Based on exp46; adds eval every 5 episodes (eval_seed=42, different from training seed=0)
name: "exp97_priority_1x1_51_WEstr_only_eval"

# wandb
wandb_project: "sumo-rl-1x1"

# SUMO files
net_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/syc_4phases.net.xml"
route_file: "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car_WEstr_only.rou.xml"
cfg_file:   "../nets/syc/1x1/Eq_350_BC_Wstr_Estr-Wleft_Eleft/Eq_350_100-0-100-0-Bus-Car_WEstr_only/Eq_350_100-0-100-0-Bus-Car_WEstr_only.sumocfg"

# Environment
observation_class: "Priority"
reward_fn:         "51-priority-pressure"
num_seconds:       1000
delta_time:        5
yellow_time:       2
min_green:         5
use_gui:           false
use_max_green:     true
max_green:         50

# DQN hyperparameters
hidden_dim:    64
lr:            0.01
gamma:         0.99
epsilon:       0.1
eps_start:     0.5
eps_end:       0.01
eps_decay:     1000
target_update: 10
capacity:      10000
mini_size:     500
batch_size:    256

# Training
seed:                0
episodes:            5000
checkpoint_interval: 5
runs:                1

# Logging
logging_mode:     "full"
metrics_interval: 50

# Evaluation during training (set eval_interval: 0 to disable)
eval_interval: 5     # greedy eval every 5 episodes
eval_seed:     42    # different from training seed (0)
